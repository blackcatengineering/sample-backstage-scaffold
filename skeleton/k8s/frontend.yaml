apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ values.name }}-frontend
  namespace: {{ values.namespace }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ values.name }}
      tier: frontend
  template:
    metadata:
      labels:
        app: {{ values.name }}
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: my-registry/{{ values.name }}-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ values.name }}-frontend-service
  namespace: {{ values.namespace }}
  {%- if values.routingType == "Octavia LoadBalancer" %}
  annotations:
    kubernetes.io/ingress.class: "openstack"
  {%- endif %}
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: {{ values.name }}
    tier: frontend
  type: {% if values.routingType == "Octavia LoadBalancer" %}LoadBalancer{% else %}ClusterIP{% endif %}

{% if values.routingType == "Ingress" %}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ values.name }}-ingress
  namespace: {{ values.namespace }}
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ values.name }}-frontend-service
                port:
                  number: 80
{% endif %}
```
